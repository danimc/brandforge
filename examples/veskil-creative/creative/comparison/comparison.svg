<text x="941" y="638" fill="#E7EDE8" font-family="sans-serif" font-size="10" font-weight="400">32</text>
<text x="546" y="692" fill="#46574D" font-family="sans-serif" font-size="16" font-weight="400">A small right-facing spur behaves like a handwritten</text>
<text x="546" y="714" fill="#46574D" font-family="sans-serif" font-size="16" font-weight="400">index tick.</text>
<text x="546" y="744" fill="#46574D" font-family="sans-serif" font-size="13" font-weight="400">Editorial, useful, composed.</text>
