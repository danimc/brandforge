<text x="453" y="638" fill="#E7EDE8" font-family="sans-serif" font-size="10" font-weight="400">32</text>
<text x="58" y="692" fill="#46574D" font-family="sans-serif" font-size="16" font-weight="400">Two offset notebook brackets frame the observation</text>
<text x="58" y="714" fill="#46574D" font-family="sans-serif" font-size="16" font-weight="400">that matters.</text>
<text x="58" y="744" fill="#46574D" font-family="sans-serif" font-size="13" font-weight="400">Quiet, deliberate, archival.</text>
<rect x="526" y="475" width="476" height="304" fill="#FFFFFF"/>
<text x="546" y="500" fill="#46574D" font-family="sans-serif" font-size="12" font-weight="700">04  /  WORDMARK</text>
<text x="546" y="534" fill="#192821" font-family="sans-serif" font-size="25" font-weight="400">Index Type</text>
<rect x="546" y="550" width="268" height="116" fill="#F8F1E2"/>
<image x="630" y="556" width="104" height="104" xlink:href="data:image/svg+xml;base64,"/>
<rect x="822" y="550" width="160" height="116" fill="#192821"/>
<image x="832" y="574" width="68" height="68" xlink:href="data:image/svg+xml;base64,"/>
<image x="916" y="586.0" width="16" height="16" xlink:href="data:image/svg+xml;base64,"/>
<text x="916" y="638" fill="#E7EDE8" font-family="sans-serif" font-size="10" font-weight="400">16</text>
