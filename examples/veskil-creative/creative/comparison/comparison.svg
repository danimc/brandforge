<text x="58" y="175" fill="#46574D" font-family="sans-serif" font-size="12" font-weight="700">01  /  ORGANIC ABSTRACT</text>
<text x="58" y="209" fill="#192821" font-family="sans-serif" font-size="25" font-weight="400">Transect</text>
<rect x="58" y="225" width="268" height="116" fill="#F8F1E2"/>
<image x="142" y="231" width="104" height="104" xlink:href="data:image/svg+xml;base64,"/>
