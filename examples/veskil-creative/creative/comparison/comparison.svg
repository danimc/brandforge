<text x="941" y="313" fill="#E7EDE8" font-family="sans-serif" font-size="10" font-weight="400">32</text>
<text x="546" y="367" fill="#46574D" font-family="sans-serif" font-size="16" font-weight="400">Two folded paper edges meet at the angle of a penciled</text>
<text x="546" y="389" fill="#46574D" font-family="sans-serif" font-size="16" font-weight="400">check.</text>
<text x="546" y="419" fill="#46574D" font-family="sans-serif" font-size="13" font-weight="400">Practical, condensed, direct.</text>
<rect x="38" y="475" width="476" height="304" fill="#FFFFFF"/>
<text x="58" y="500" fill="#46574D" font-family="sans-serif" font-size="12" font-weight="700">03  /  NEGATIVE SPACE</text>
<text x="58" y="534" fill="#192821" font-family="sans-serif" font-size="25" font-weight="400">Sample Window</text>
<rect x="58" y="550" width="268" height="116" fill="#F8F1E2"/>
<image x="142" y="556" width="104" height="104" xlink:href="data:image/svg+xml;base64,"/>
