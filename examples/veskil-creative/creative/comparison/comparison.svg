<text x="58" y="367" fill="#46574D" font-family="sans-serif" font-size="16" font-weight="400">An unbroken survey route reads as a pale channel</text>
<text x="58" y="389" fill="#46574D" font-family="sans-serif" font-size="16" font-weight="400">between two contour forms.</text>
<text x="58" y="419" fill="#46574D" font-family="sans-serif" font-size="13" font-weight="400">Calm, observant, field-tested.</text>
<rect x="526" y="150" width="476" height="304" fill="#FFFFFF"/>
<text x="546" y="175" fill="#46574D" font-family="sans-serif" font-size="12" font-weight="700">02  /  MONOGRAM</text>
<text x="546" y="209" fill="#192821" font-family="sans-serif" font-size="25" font-weight="400">Folded V</text>
<rect x="546" y="225" width="268" height="116" fill="#F8F1E2"/>
<image x="630" y="231" width="104" height="104" xlink:href="data:image/svg+xml;base64,"/>
<rect x="822" y="225" width="160" height="116" fill="#192821"/>
<image x="832" y="249" width="68" height="68" xlink:href="data:image/svg+xml;base64,"/>
